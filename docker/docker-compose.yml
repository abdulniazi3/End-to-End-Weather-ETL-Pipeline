services:
  postgres:
    image: postgres:17

    container_name: weather_postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: libertycity
      POSTGRES_DB: weathers_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: